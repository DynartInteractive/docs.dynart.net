title       = "Dynart Docs"
description = "The gopherlab design on the backgrounds of docs.dynart.net: warm dark greys under gopherlab's Dracula ink, and the Dynart logo alone in the header."
author      = "gopher"
version     = "1.2.0"

; The places this theme renders.
;
; `sidebar` is drawn by both layouts; `home_top` only by `layout-home.phtml`, so anything put
; there is on the front page and on no other page of the site.
places[] = main
places[] = social
places[] = sidebar

; Under a post and under a page, for anything *about* what was just read - comments above all.
; A theme that declares its own places replaces the built-in list rather than adding to it, so
; this has to be named here even though the CMS knows about it.
places[] = after_content
places[] = home_top
places[] = footer
